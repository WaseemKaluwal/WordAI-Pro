<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" height="64" width="260">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Icon Squircle -->
  <g filter="url(#subtleShadow)">
    <rect x="4" y="6" width="52" height="52" rx="15" fill="url(#badgeGrad)"/>
    <!-- Yellow Lightning with Dark Outline -->
    <path d="M33 15 L19 33 L28 33 L23 49 L41 29 L31 29 Z" 
          fill="#FBBF24" 
          stroke="#111827" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Brand Text: WordAI -->
  <text x="68" y="42" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="#0F172A" 
        letter-spacing="-0.5px">WordAI</text>

  <!-- PRO Badge Pill -->
  <rect x="180" y="18" width="62" height="28" rx="8" fill="#7C3AED"/>
  <text x="211" y="38" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="800" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="0.8px">PRO</text>
</svg>
